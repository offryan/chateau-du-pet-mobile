name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  testes:
    name: Testes (API e ViewModels)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Testes de integração da API
        run: dotnet test --project tests/ChateauDuPet.Api.Tests
        env:
          CHATEAU_TEST_DB: Host=localhost;Username=postgres;Password=postgres

      - name: Testes dos ViewModels e do cliente da API
        run: dotnet test --project tests/ChateauDuPet.App.Core.Tests

  android:
    name: App Android (.NET MAUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Workload do MAUI e SDK do Android
        run: |
          dotnet workload install maui-android
          dotnet build src/ChateauDuPet.App -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Gera o APK (Release)
        run: |
          dotnet publish src/ChateauDuPet.App -f net10.0-android -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -o artefatos
          cp artefatos/*-Signed.apk chateau-du-pet.apk

      - uses: actions/upload-artifact@v5
        with:
          name: chateau-du-pet-apk
          path: chateau-du-pet.apk

  windows:
    name: App Windows (.NET MAUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Workload do MAUI para Windows
        run: dotnet workload install maui-windows

      # App avulso (sem instalador): tudo o que ele precisa vai junto na pasta
      - name: Gera o app (Release)
        run: >
          dotnet publish src/ChateauDuPet.App -f net10.0-windows10.0.19041.0 -c Release
          -p:RuntimeIdentifierOverride=win-x64 -p:WindowsPackageType=None
          -p:SelfContained=true -p:WindowsAppSDKSelfContained=true
          -o "pacote/Chateau Du Pet/app"

      # O zip abre numa pasta só, com o iniciador e o LEIA-ME na frente e as centenas
      # de arquivos do app guardadas em "app":
      #   Chateau Du Pet/
      #   ├── Chateau Du Pet.exe
      #   ├── LEIA-ME.txt
      #   └── app/
      - name: Monta a pasta com o iniciador
        shell: pwsh
        run: |
          # O csc trata "/" como início de opção: todos os caminhos vão completos, com "\"
          $raiz = (Resolve-Path "pacote\Chateau Du Pet").Path
          $fontes = (Resolve-Path "build\windows").Path
          $icone = Get-ChildItem "$raiz\app" -Filter *.ico -Recurse | Select-Object -First 1
          $argumentos = @(
            "/nologo", "/target:winexe", "/optimize+", "/codepage:65001",
            "/r:System.Windows.Forms.dll", "/out:$raiz\Chateau Du Pet.exe"
          )
          if ($icone) { $argumentos += "/win32icon:$($icone.FullName)" }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" @argumentos "$fontes\Iniciar.cs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$fontes\LEIA-ME.txt" $raiz
          Get-ChildItem $raiz | Format-Table Name, Length

      - name: Compacta em zip
        shell: pwsh
        run: Compress-Archive -Path "pacote/Chateau Du Pet" -DestinationPath chateau-du-pet-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: chateau-du-pet-windows
          path: chateau-du-pet-windows.zip

  release:
    name: Publica APK e app Windows na release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [testes, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: chateau-du-pet-*
          merge-multiple: true

      # A release pode já existir (criada pelo site ou pela API, com as notas escritas à mão):
      # nesse caso só anexa os arquivos a ela
      - name: Anexa os arquivos à release
        run: |
          arquivos="chateau-du-pet.apk chateau-du-pet-windows.zip"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $arquivos --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" $arquivos --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
